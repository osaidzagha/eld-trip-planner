services:
  - type: web
    name: eld-trip-planner-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free          # Change to "starter" or higher for production
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render generates a random secret
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false               # Set in Render dashboard to your Vercel URL
      - key: CSRF_TRUSTED_ORIGINS
        sync: false               # Set in Render dashboard, same as CORS_ALLOWED_ORIGINS
      # Optional: ORS routing key (falls back to public OSRM when absent)
      - key: ORS_API_KEY
        sync: false
